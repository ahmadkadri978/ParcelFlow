name: Java CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      DB_URL: jdbc:postgresql://localhost:5432/parcelflow
      DB_USERNAME: parcelflow
      DB_PASSWORD: parcelflow_dev

    services:
      postgres:
        image: postgres:17-alpine

        env:
          POSTGRES_DB: parcelflow
          POSTGRES_USER: parcelflow
          POSTGRES_PASSWORD: parcelflow_dev

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U parcelflow -d parcelflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: bash ./mvnw --batch-mode --no-transfer-progress verify